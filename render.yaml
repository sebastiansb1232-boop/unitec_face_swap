# render.yaml — ANOTHERFACE · UNITEC
# Modo: Static Site (gratis, HTTPS automático, sin servidor Express necesario)
# Build: genera public/config.js con las variables de entorno antes de publicar

services:
  - type: web
    name: anotherface-unitec
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: public
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
