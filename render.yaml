# Despliegue como Static Site (recomendado: gratis, HTTPS automático,
# funciona igual en PC y Android porque es la misma web responsive).
#
# En Render: New + -> Blueprint -> conecta tu repo -> Apply.
# Luego ve a la pestaña "Environment" del servicio y completa:
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
# (los valores están vacíos aquí a propósito: nunca pongas claves reales
# en este archivo si el repo es público).

services:
  - type: web
    name: unitec-panoptico-demo
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: public
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

