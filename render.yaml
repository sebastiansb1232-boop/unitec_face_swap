# render.yaml — ANOTHERFACE · UNITEC
# Tipo: Web Service (Node.js con Express)
# El servidor sirve /config.js dinámicamente con las vars de entorno reales.
# NO se necesita paso de build para generar config.js.

services:
  - type: web
    name: anotherface-unitec
    env: node
    buildCommand: "npm install"
    startCommand: "node server.js"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
