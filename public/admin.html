<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101925"><title>Administración · Anotherface</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="ambient" aria-hidden="true"></div>
<link rel="icon" type="image/png" href="/favicon.png?v=1">
<header class="topbar"><a class="brand" href="/">Anotherface<span class="brand-dot"></span></a><a class="subtle" href="/">Volver a la cámara</a></header>
<main class="workspace">
<section id="admin-login" class="login-box"><p class="eyebrow">ADMINISTRACIÓN</p><h1>Bienvenido</h1><p class="subtle">Accede a las fotos del estudio.</p>
<form id="admin-form"><label for="admin-email">Correo electrónico</label><input type="email" id="admin-email" required autocomplete="username">
<label for="admin-pwd">Contraseña</label><input type="password" id="admin-pwd" required autocomplete="current-password">
<button class="btn btn-primary" type="submit">Entrar al panel</button></form><p id="admin-error" class="error status" role="alert"></p></section>
<section id="admin-dashboard" class="hidden">
<div class="page-heading"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Fotos del estudio</h1></div><button id="logout-btn" class="btn btn-ghost">Cerrar sesión</button></div>
<div class="admin-toolbar"><p class="subtle">Solo fotos tomadas en las últimas 4 horas. Sin registros de actividad.</p><button id="refresh-btn" class="btn btn-ghost">Actualizar</button></div>
<p id="gallery-status" class="status" role="status"></p><div id="gallery" class="gallery"></div>
<nav class="pagination" aria-label="Páginas de fotos"><button id="prev-page" class="btn btn-ghost" disabled>Anterior</button><span id="page-label" class="subtle"></span><button id="next-page" class="btn btn-ghost" disabled>Siguiente</button></nav>
</section>
<dialog id="photo-detail" aria-labelledby="detail-title"><div class="detail-head"><h2 id="detail-title">Detalle de foto</h2><button id="close-detail" class="btn btn-ghost">Cerrar</button></div>
<div class="detail-grid"><div class="detail-picture"><img id="detail-image" alt="Foto seleccionada"><canvas id="detail-mesh" aria-hidden="true"></canvas></div>
<div><dl id="detail-fields"></dl><label class="check-row"><input id="show-mesh" type="checkbox"><span>Mostrar puntos faciales</span></label><p id="mesh-note" class="subtle"></p><a id="detail-download" class="btn btn-primary" download>Descargar foto</a></div></div></dialog>
</main><footer class="app-footer"><span>Anotherface · UNITEC</span><span>Acceso restringido</span></footer><script src="admin.js" defer></script></body></html>
